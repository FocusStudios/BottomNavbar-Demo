<style>

html {
-webkit-tap-highlight-color:transparent;
scroll-behavior:smooth;
user-select:none;}

* {
margin:0;
padding:0;
box-sizing:border-box;
font-style:normal;
font-optical-sizing:auto;
font-family:"Montserrat", sans-serif;}

:root {
--primary:#730BBA;
--secondary:#D9D9D9;
--background:#fff;}

body {
margin:0;
width:100vw;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;}

.Container {
position:absolute;
width:330px;
height:250px;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
background:#E5C7FC;
pointer-events:none;}

.BottomNavBar {
position:absolute;
height:150px;
width:500px;
display:flex;
align-items:center;
justify-content:center;
transform:scale(0.7);}

.Wrapper {
position:absolute;
bottom:10px;
width:320px;
height:100px;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;}

.rectangle {
position:absolute;
bottom:40px;
width:320px;
height:20px;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:var(--background);}

.sides {
position:absolute;
width:calc(50% - 160px);
height:100px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;}

.side {
position:absolute;
width:200%;
height:70px;
background:var(--background);
filter:drop-shadow(0 2px 6px rgba(0,0,0,0.2));}

.Left {
left:0;}

.left {
left:50px;
border-radius:35px;}

.Right {
right:0;}

.right {
right:50px;
border-radius:35px;}

.container {
position:absolute;
bottom:15px;
width:320px;
height:100%;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;}

.indicator {
position:absolute;
left:-17.5px;
--i1:-17.5px;
--i2:110px;
width:100%;
height:100px;
display:flex;
justify-content:center;
align-items:center;
transition:0.6s cubic-bezier(0,0,0,1);}

.background {
position:absolute;
bottom:0;
left:-552.5px;
fill:var(--background);}

.wrapper {
position:absolute;
bottom:60px;
width:270px;
height:50px;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;}

.icons {
position:absolute;
width:270px;
height:50px;
display:flex;
gap:60px;
list-style:none;}

.icon {
position:relative;
width:50px;
height:50px;}

.icon svg {
fill:var(--secondary);
transform:scale(0.8);}

.icons.A {
bottom:0;}

.icons.B, .icons.C {
bottom:-140px;}

.icon.A:nth-child(1) {
bottom:-140px;}

.icon.A {
position:relative;
bottom:0;
transition:bottom 0.6s cubic-bezier(0,0,0,1), opacity 0s;}

.icon.B, .icon.C {
position:relative;
bottom:0;
transition:bottom 0.7s cubic-bezier(0,0,0,1), opacity 0s;}

.blur {
position:absolute;
bottom:-40px;
width:320px;
height:50px;
filter:blur(5px);
display:flex;
background:var(--background);}

.ICONS {
position:absolute;
bottom:20px;
left:0;
width:135px;
height:80px;
display:flex;
align-items:center;
justify-content:center;
list-style:none;}

.ICON {
position:absolute;
bottom:-80px;
width:45px;
height:45px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:var(--background);
transition:0.6s cubic-bezier(0,0,0,1);
box-shadow:1px 2px 5px rgba(0,0,0,0.2);}

.ICON.active {
bottom:18px;}

.ICON svg {
fill:var(--primary);
transform:scale(0.9);}

.clicks {
position:absolute;
bottom:50px;
width:270px;
height:50px;
display:flex;
gap:60px;
list-style:none;}

.click {
position:relative;
width:50px;
height:50px;
display:flex;
align-items:center;
justify-content:center;}

.text {
position:absolute;
bottom:10px;
font-size:0.5rem;
color:var(--secondary);
transition:0.4s;}

.text.active {
font-size:0.6rem;
color:var(--primary);}

</style>

<script>

const IconAs = document.querySelectorAll(".icon.A");
const IconBs = document.querySelectorAll(".icon.B");
const IconCs = document.querySelectorAll(".icon.C");
const ICONs = document.querySelectorAll(".ICON");
const Texts = document.querySelectorAll(".text");
const Clicks = document.querySelectorAll(".click");
const indicator = document.querySelector(".indicator");

var x = 0;

// reset IconAs & IconBs & IconCs//
function reset () {

IconCs.forEach((IconC, index) => {
IconCs[index].style.bottom="0",IconCs[index].style.opacity="0";});

IconBs.forEach((IconB, index) => {
IconBs[index].style.bottom="0",IconBs[index].style.opacity="0";});

IconAs.forEach((IconA, index) => {
IconAs[index].style.bottom="0",IconAs[index].style.opacity="1";}); 

}

const Icon1 = () => { 

indicator.style.left="var(--i1)";
reset();
IconAs[0].style.bottom="-120px",IconAs[0].style.opacity="0";

// set the opacity & location of moving icons //
IconAs.forEach((IconA,index) => {

if(index > 0 && index < x){IconA.style.opacity="0";}

});

IconCs.forEach((IconC,index) => {

if(index > 0 && index < x){IconC.style.opacity="1",IconC.style.bottom="140px";}

});

// ICONS //
ICONs.forEach(ICON => ICON.classList.remove("active"));
ICONs[0].classList.add("active");

// Texts //
Texts.forEach(Text => Text.classList.remove("active"));
Texts[0].classList.add("active");

// Clicks //
Clicks.forEach(Click => Click.classList.remove("active"));
Clicks[0].classList.add("active");

x = 0;

}

const Icon2 = () => {

indicator.style.left="calc(var(--i1) + var(--i2))";
reset();
IconAs[1].style.bottom="-120px",IconAs[1].style.opacity="0";

// set the opacity & location of moving icons //
IconAs.forEach((IconA,index) => {

if(index > 1 && index < x){IconA.style.opacity="0";}

});

IconCs.forEach((IconC,index) => {

if(index > 1 && index < x){IconC.style.opacity="1",IconC.style.bottom="140px";}

});

// ICONS //
ICONs.forEach(ICON => ICON.classList.remove("active"));
ICONs[1].classList.add("active");

// Texts //
Texts.forEach(Text => Text.classList.remove("active"));
Texts[1].classList.add("active");

// Clicks //
Clicks.forEach(Click => Click.classList.remove("active"));
Clicks[1].classList.add("active");

x = 1;

}

const Icon3 = () => {

indicator.style.left="calc(var(--i1) + 2*var(--i2))";
reset();
IconAs[2].style.bottom="-120px",IconAs[2].style.opacity="0";

// set the opacity & location of moving icons //
IconAs.forEach((IconA,index) => {

if(index > x && index < 2){IconA.style.opacity="0";}
