* {

:root {
--primary:#000;
--secondary:#CACACA;
--background:#fff;}

body {

height:100vh;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;}

.Container {
position:absolute;
width:330px;
height:250px;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
pointer-events:none;
overflow:hidden;
background:#00E0FF;}

.main-container {
position:absolute;
width:330px;
height:250px;
display:flex;
align-items:center;
justify-content:center;
pointer-events:none;
overflow:hidden;

.Wrapper {

height:600px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
background:#00E0FF;
transform:scale(0.7) rotate(37.5deg) translate(-40px,0) skewX(-18deg);}

.MockUp {
position:absolute;
width:100%;
height:auto;
filter:drop-shadow(0 10px 15px rgba(0,0,0,0.5));}

.BottomNavBar {
position:absolute;
width:100%;
height:100px;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;}

.container {
position:absolute;
bottom:0;
width:415px;
height:100px;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;}

.indicator {
position:absolute;
left:0;
--i1:0px;
--i2:70px;
bottom:0;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
transition:0.6s cubic-bezier(0,0,0,1);}

.background {
position:absolute;
bottom:0;
left:-552.5px;
fill:var(--background);
pointer-events:auto;}

.icons {
position:absolute;
width:330px;
height:50px;
display:flex;
gap:20px;
list-style:none;}

.icon {
position:relative;
width:50px;
height:50px;}

.icon svg {
fill:var(--secondary);
transform:scale(0.9);}

.icons.A {
bottom:10px;}

.icons.B, .icons.C {
bottom:-130px;}

.icon.A:nth-child(1) {
bottom:-130px;}

.icon.A {
position:relative;
bottom:0;
transition:bottom 0.6s cubic-bezier(0,0,0,1), opacity 0s;}

.icon.B, .icon.C {
position:relative;
bottom:0;
transition:bottom 0.7s cubic-bezier(0,0,0,1), opacity 0s;}

.blur {
position:absolute;
bottom:-40px;
width:415px;
height:50px;
filter:blur(5px);
background:var(--background);
pointer-events:none;}

.ICONS {
position:absolute;
bottom:20px;
left:0;
width:135px;
height:80px;
display:flex;
align-items:center;
justify-content:center;
list-style:none;
pointer-events:none;}

.ICONS {
position:absolute;
bottom:20px;
left:0;
width:135px;
height:80px;
display:flex;
align-items:center;
justify-content:center;
list-style:none;
pointer-events:none;}

.ICON {
position:absolute;
bottom:-80px;
width:48px;
height:48px;
border-radius:15px;
display:flex;
justify-content:center;
align-items:center;
pointer-events:auto;
background:var(--background);
transform:rotate(45deg);
transition:0.6s cubic-bezier(0,0,0,1);
box-shadow:1px 4.5px 9px rgba(0,0,0,0.35);}

.X {
transform:rotate(-45deg);}

.ICON.active {
bottom:12px;}

.clicks {
position:absolute;
bottom:10px;
width:330px;
height:50px;
display:flex;
gap:20px;
list-style:none;}

.click {
position:relative;
width:50px;
height:50px;}

.path {
stroke:var(--primary);
stroke-dasharray:170;}

.line {
stroke:var(--primary);
stroke-dasharray:170;
stroke-dashoffset:170;}

.dot {
fill:var(--primary);
visibility:hidden;}

<script>

const IconAs = document.querySelectorAll(".icon.A");
const IconBs = document.querySelectorAll(".icon.B");
const IconCs = document.querySelectorAll(".icon.C");
const ICONs = document.querySelectorAll(".ICON");
const Clicks = document.querySelectorAll(".click");
const indicator = document.querySelector(".indicator");

var x = 0;

// reset IconAs & IconBs & IconCs//
function reset () {

IconCs.forEach((IconC, index) => {
IconCs[index].style.bottom="0",IconCs[index].style.opacity="0";});

IconBs.forEach((IconB, index) => {
IconBs[index].style.bottom="0",IconBs[index].style.opacity="0";});

IconAs.forEach((IconA, index) => {
IconAs[index].style.bottom="0",IconAs[index].style.opacity="1";}); 

}


const Icon1 = () => { 

indicator.style.left="var(--i1)";
reset();
IconAs[0].style.bottom="-120px",IconAs[0].style.opacity="0";

// set the opacity & location of moving icons //
IconAs.forEach((IconA,index) => {

if(index > 0 && index < x){IconA.style.opacity="0";}

});

IconCs.forEach((IconC,index) => {

if(index > 0 && index < x){IconC.style.opacity="1",IconC.style.bottom="140px";}

});

// ICONS //
ICONs.forEach(ICON => ICON.classList.remove("active"));
ICONs[0].classList.add("active");

// Clicks //
Clicks.forEach(Click => Click.classList.remove("active"));
Clicks[0].classList.add("active");

x = 0;

}

const Icon2 = () => {

indicator.style.left="calc(var(--i1) + var(--i2))";
reset();
IconAs[1].style.bottom="-120px",IconAs[1].style.opacity="0";

// set the opacity & location of moving icons //
IconAs.forEach((IconA,index) => {

if(index > 1 && index < x){IconA.style.opacity="0";}

});

IconCs.forEach((IconC,index) => {

if(index > 1 && index < x){IconC.style.opacity="1",IconC.style.bottom="140px";}

});

// ICONS //
ICONs.forEach(ICON => ICON.classList.remove("active"));
ICONs[1].classList.add("active");

// Clicks //
Clicks.forEach(Click => Click.classList.remove("active"));
Clicks[1].classList.add("active");

x = 1;

}

const Icon3 = () => {

indicator.style.left="calc(var(--i1) + 2*var(--i2))";
reset();
IconAs[2].style.bottom="-120px",IconAs[2].style.opacity="0";

// set the opacity & location of moving icons //
IconAs.forEach((IconA,index) => {

if(index > x && index < 2){IconA.style.opacity="0";}

});

IconBs.forEach((IconB,index) => {

if(index > x && index < 2){IconB.style.opacity="1",IconB.style.bottom="140px";}

});

IconAs.forEach((IconA,index) => {

if(index > 2 && index < x){IconA.style.opacity="0";}

});

IconCs.forEach((IconC,index) => {

if(index > 2 && index < x){IconC.style.opacity="1",IconC.style.bottom="140px";}

});

// ICONS //
ICONs.forEach(ICON => ICON.classList.remove("active"));
ICONs[2].classList.add("active");

// Clicks //
Clicks.forEach(Click => Click.classList.remove("active"));
Clicks[2].classList.add("active");

x = 2;

}

indicator.style.left="calc(var(--i1) + 3*var(--i2))";

IconAs[3].style.bottom="-120px",IconAs[3].style.opacity="0";

// set the opacity & location of moving icons //
IconAs.forEach((IconA,index) => {

if(index > x && index < 3){IconA.style.opacity="0";}

});

IconBs.forEach((IconB,index) => {

if(index > x && index < 3){IconB.style.opacity="1",IconB.style.bottom="140px";}

});

// ICONS //
ICONs.forEach(ICON => ICON.classList.remove("active"));
ICONs[3].classList.add("active");

// Clicks //
Clicks.forEach(Click => Click.classList.remove("active"));
Clicks[3].classList.add("active");

x = 3;

}

});

IconBs.forEach((IconB,index) => {

if(index > x && index < 4){IconB.style.opacity="1",IconB.style.bottom="140px";}

});

// ICONS //
ICONs.forEach(ICON => ICON.classList.remove("active"));
ICONs[4].classList.add("active");

// Clicks //
Clicks.forEach(Click => Click.classList.remove("active"));
Clicks[4].classList.add("active");

x = 4;

}


function demo() {
  
const icons = [Icon2, Icon3, Icon4, Icon5, Icon1];

for (let i = 0; i < icons.length; i++) {
    
setTimeout(() => {icons[i]();}, (i + 1) * 1000);
  
}

}

demo();
