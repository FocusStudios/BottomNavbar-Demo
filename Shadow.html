<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="Gentle-Lamp.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Istok+Web:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>

html {
-webkit-tap-highlight-color:transparent;
scroll-behavior:smooth;
user-select:none;}

body {
margin:0;
width:100vw;
height:100vh;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;}

* {
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Istok Web", serif;
font-weight:300;
font-style:normal;}

:root {
--primary:#FFCB04;
--secondary:#CACACA;
--tertiary:#000;
--background:#fff;}

.container {
position:absolute;
width:330px;
height:250px;
display:flex;
align-items:center;
justify-content:center;
border-radius:20px;
background:var(--primary);
pointer-events:none;}

nav {
position:absolute;
width:400px;
height:80px;
display:flex;
align-items:center;
justify-content:center;
border-radius:40px;
transform:scale(0.7);
background:var(--background);
box-shadow:0 8px 15px rgba(0,0,0,0.1);}

nav .icons {
position:absolute;
top:10px;
width:330px;
height:50px;
display:flex;
gap:20px;}

nav .icon {
position:relative;
width:50px;
height:50px;
z-index:1;
display:flex;
justify-content:center;
transition:0.6s;}

nav .icon.active {
pointer-events:none;}

.icon svg {
transform:scale(0.9);}

nav .text {
position:absolute;
bottom:-3px;
font-size:0.5rem;
font-weight:500;
color:var(--secondary);
transition:0.3s;}

nav .shadow {
opacity:0;
transition:0.3s;
fill:var(--primary);}

nav .path {
transition:0.3s;
fill:var(--secondary);}

nav .icon.active .path {
fill:var(--tertiary);
transform:translate(-3px,-3px);}

nav .icon.active .text {
color:var(--tertiary);}

nav .icon.active .shadow {
opacity:1;}

</style>
</head>

<script>

const Icons = document.querySelectorAll(".icon");

Icons.forEach((Icon,index) => {

Icons[index].addEventListener("click",() => {

document.querySelector(".icon.active").classList.remove("active");
Icons[index].classList.add("active");

});});

function demo() {

const icons = [1, 2, 3, 4, 0];

icons.forEach((icon, i) => {

setTimeout(() => {Icons[icon].click();}, (i + 1) * 1000);

});

}

demo();
setInterval(() => {demo();},5000);

</script>
