<style>

html {
-webkit-tap-highlight-color:transparent;
scroll-behavior:smooth;
user-select:none;}

body {
margin:0;
width:100vw;
height:100vh;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;}

* {
margin:0;
padding:0;
box-sizing:border-box;
font-weight:800;
font-style:normal;
font-optical-sizing:auto;
font-family:"Montserrat", sans-serif;}

:root {
--primary:#00C8FF;
--secondary:#2D2355;
--background:#fff;
--shadow:rgba(217,217,217,0.5);
--gradient:linear-gradient(#00C8FF,#00F0FF);}

.container {
position:absolute;
width:330px;
height:250px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
border-radius:20px;
background:#D9D9D9;
pointer-events:none;}

.screen {
position:absolute;
bottom:0;
width:360px;
height:400px;
display:flex;
align-items:center;
justify-content:center;
border-radius:35px;
overflow:hidden;
transform:scale(0.7);
background:var(--background);
box-shadow:0 15px 25px rgba(0,0,0,0.15);}

nav {
position:absolute;
bottom:0;
width:360px;
height:70px;
display:flex;
align-items:center;
justify-content:center;}

nav .main-container {
position:absolute;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
border-radius:10px;
background:var(--background);
box-shadow:0 -8px 10px rgba(0,0,0,0.05);}

.icons {
position:absolute;
top:0;
width:330px;
height:50px;
display:flex;
gap:20px;
list-style:none;
transition:0.3s;}

.icon.M {
position:relative;
width:50px;
height:50px;}

.icon.M svg {
fill:var(--secondary);
transition:0.2s;}

.icon.M.active svg {
fill:var(--primary);}

.Add {
position:relative;
bottom:5px;
width:50px;
height:50px;
cursor:pointer;
background:var(--gradient);
clip-path:path("M22.3958 1.50352C24.0073 0.573137 25.9927 0.573137 27.6042 1.50352L44.0465 10.9965C45.6579 11.9269 46.6506 13.6463 46.6506 15.507V34.493C46.6506 36.3537 45.6579 38.0731 44.0465 39.0035L27.6042 48.4965C25.9927 49.4269 24.0073 49.4269 22.3958 48.4965L5.95353 39.0035C4.34207 38.0731 3.34937 36.3537 3.34937 34.493V15.507C3.34937 13.6463 4.34207 11.9269 5.95353 10.9965L22.3958 1.50352Z");}

.Add svg {
stroke:var(--background);}

nav.active .Add {
animation:Button1 0.5s forwards;}

nav.inactive .Add {
animation:Button2 0.5s forwards;}

nav.active .Add svg {
animation:Plus1 0.3s forwards;}

nav.inactive .Add svg {
animation:Plus2 0.3s forwards;}

.Shadow {
position:absolute;
bottom:15px;
width:40px;
height:12px;
border-radius:50%;
filter:blur(4px);
background:var(--shadow);}

nav.active .Shadow {
animation:Shadow1 0.7s;}

nav.inactive .Shadow {
animation:Shadow2 0.7s;}

.submenu {
position:absolute;
bottom:0;
width:50px;
height:50px;
border-radius:25px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
transform:translateY(-10px);
background:var(--secondary);
box-shadow:0 8px 12px rgba(0,0,0,0.2);}

.submenu.active {
animation:Show1 0.8s ease-out forwards;}

.submenu.inactive {
animation:Show2 1s ease-out forwards;}

.liquid {
position:absolute;
width:250px;
height:150px;
display:flex;
align-items:center;
justify-content:center;
pointer-events:none;
filter:url("#liquid");
clip-path:url("#liquidClip");}

#liquidPath.active {
animation:Liquid1 0.4s ease forwards;}

#liquidPath.inactive {
animation:Liquid2 0.55s ease forwards;}

.liquid svg {
position:absolute;}

.Icons {
position:absolute;
width:184px;
height:44px;
display:flex;
column-gap:26px;}

.Icon {
position:relative;
width:44px;
height:44px;
opacity:0;
display:flex;
align-items:center;
justify-content:center;}

.Icon svg {
position:absolute;
fill:var(--background);}

.submenu.active .Icon {
opacity:1;
pointer-events:auto;
transition:0s 0.8s;}

.Circle {
position:absolute;
width:100%;
height:100%;
border-radius:50%;
opacity:0;
transform:scale(0.5);
background:var(--background);}

.Icon.active .Circle {
animation:Circle 0.8s;}

.blob {
fill:var(--background);}

.blob.A.active {
animation:BlobA1 0.8s forwards;}

.blob.B.active {
animation:BlobB1 0.8s forwards;}

.blob.C.active {
animation:BlobC1 0.8s forwards;}

.blob.A.inactive {
animation:BlobA2 0.8s forwards;}

.blob.B.inactive {
animation:BlobB2 0.8s forwards;}

.blob.C.inactive {
animation:BlobC2 0.8s forwards;}

@keyframes Circle {
50%{transform:scale(1);opacity:0.15;}
100%{transform:scale(0.5);opacity:0;}}

@keyframes Shadow1 {
40%{transform:scale(0.7);}
100%{transform:scale(1);}}

@keyframes Shadow2 {
40%{transform:scale(0.7);}
100%{transform:scale(1);}}

@keyframes Button1 {
40%{transform:scale(0.7);}
100%{transform:rotate(-180deg);}}

@keyframes Button2 {
0%{transform:rotate(-180deg);}
40%{transform:scale(0.7) rotate(-180deg);}
100%{transform:rotate(0deg);}}

@keyframes Plus1 {
40%{transform:rotate(0deg);}
100%{transform:rotate(45deg);}}

@keyframes Plus2 {
0%{transform:rotate(45deg);}
40%{transform:rotate(45deg);}
100%{transform:rotate(0deg);}}

</style>
</head>

<script>

const Nav = document.querySelector("nav");
const Add = document.querySelector(".icon.Add");
const Submenu = document.querySelector(".submenu");
const Liquid = document.querySelector(".liquid");
const Blobs = document.querySelectorAll(".blob");
const Icons = document.querySelectorAll(".Icon");
const icons = document.querySelectorAll(".icon.M");
const Backs = document.querySelectorAll(".back");
const liquidPath = document.getElementById("liquidPath");

let liquidTimeout;
let blobsTimeout;
let submenuTimeout;
let closeLiquidTimeout;
let animating = false;

function clearTimers() {

clearTimeout(liquidTimeout);
clearTimeout(blobsTimeout);
clearTimeout(submenuTimeout);
clearTimeout(closeLiquidTimeout);

}

function Open() {

clearTimers();

Nav.classList.add("active");
Nav.classList.remove("inactive");

Submenu.classList.add("active");
Submenu.classList.remove("inactive");

liquidTimeout = setTimeout(() => {

liquidPath.classList.add("active");
liquidPath.classList.remove("inactive");

blobsTimeout = setTimeout(() => {

Blobs.forEach(Blob => {
Blob.classList.add("active");
Blob.classList.remove("inactive");
});

setTimeout(() => {animating = false;},100);

},100);

},250);

}

function Close() {

clearTimers();

Nav.classList.add("inactive");
Nav.classList.remove("active");

Blobs.forEach(Blob => {
Blob.classList.add("inactive");
Blob.classList.remove("active");
});

submenuTimeout = setTimeout(() => {

Submenu.classList.add("inactive");
Submenu.classList.remove("active");

closeLiquidTimeout = setTimeout(() => {

liquidPath.classList.add("inactive");
liquidPath.classList.remove("active");

setTimeout(() => {animating = false;},100);

},200);

},300);

}


//Click on Add btn
Add.addEventListener("click", () => {

if (animating) return;

animating = true;

void liquidPath.getBoundingClientRect();

if(Nav.classList.contains("active")){

Close();

}else{

Open();

}

});

function demo() {

setTimeout(() => {Open();},1000);
setTimeout(() => {Close();},3500);

}

demo();
setInterval(() => {demo();},5000);

</script>
