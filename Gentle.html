<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="Spring-Gentle.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Istok+Web:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>

html {
-webkit-tap-highlight-color:transparent;
scroll-behavior:smooth;
user-select:none;}

body {
margin:0;
width:100vw;
height:100vh;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;}

* {
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Istok Web", serif;
font-weight:300;
font-style:normal;}

:root {
--primary:linear-gradient(#FF0099,#FF005C);
--secondary:#000;
--tertiary:#CACACA;
--background:#fff;
--text:#FF0099;
--shadow:rgba(255,0,153,0.2);}

.Container {
position:absolute;
width:330px;
height:250px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
border-radius:20px;
background:var(--primary);}

.screen {
position:absolute;
width:360px;
height:400px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
background:var(--primary);
outline:6px solid #FFB3D3;
border-radius:30px;
transform:scale(0.7) translateY(-30%);
box-shadow:0 20px 40px rgba(0,0,0,0.3);}

nav {
position:absolute;
bottom:0;
width:100%;
height:70px;
display:flex;
align-items:center;
justify-content:center;}

.shadow-container {
position:absolute;
bottom:0;
width:100%;
height:100px;
display:flex;
justify-content:center;
align-items:center;
pointer-events:none;}

nav .curve .group {
transform-origin:center;
transform:translateY(0.1px) scale(1);
transition:0.4s cubic-bezier(0.5,-2,1,1);}

nav.active .curve .group {
transform:translateY(3.5px) scale(1.2);
transition:0.6s cubic-bezier(0,0,0.5,3);}

.shadow-container .curve {
opacity:0.3;
filter:blur(6px);
fill:var(--secondary);}

nav .main-container {
position:absolute;
width:360px;
height:70px;
display:flex;
align-items:center;
justify-content:center;
background:var(--background);
border-radius:10px 10px 0 0;}

.rect {
position:absolute;
bottom:10px; 
width:70px;
height:4px;
border-radius:2px;
background:#F1F1F1;}

.button {
position:absolute;
bottom:10px;
transform:translateY(0) scale(1);
transition:0.4s cubic-bezier(0.5,-2,1,1);}

nav.active .button {
transform:translateY(5px) scale(1.2);
transition:0.6s cubic-bezier(0,0,0.5,3);}

.button svg {
position:absolute;
top:-20px;
fill:var(--background);
pointer-events:none;}

.button section {
position:absolute;
bottom:15px;
width:50px;
height:50px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
background:var(--primary);
box-shadow:0 5px 10px var(--shadow);}

.button .circle1 {
position:relative;
width:35px;
height:35px;
border-radius:20px;
border:6px solid var(--background);}

.button .circle2 {
position:absolute;
top:15px;
left:25px;
width:10px;
height:10px;
border-radius:50%;
background:var(--background);}

.icons {
position:absolute;
top:0;
width:330px;
height:50px;
list-style:none;
display:flex;
gap:20px;
transition:0.3s;}

.icon, .Icon, .button {
position:relative;
width:50px;
height:50px;
display:flex;
justify-content:center;}

.icon.A {
transform:scale(0.9);}

.icon.A .container {
position:absolute;
width:50px;
height:50px;}

.icon.A .fill {
position:absolute;
width:50px;
height:50px;
background:var(--primary);}

.icon.A svg {
position:absolute;
transform-origin:center;}

.icon.A .fill {
--i1:25px;
--i2:-20px;
--i3:25px;
--i4:-20px;
transform:translate(var(--i1),var(--i3));}

.icon.A.inactive .fill {
animation:Hide 0.6s cubic-bezier(0.5,-0.5,1,1) forwards;}

.icon.A.active .fill {
animation:Gentle-Translate 1.6s forwards;}

.icon.A:nth-child(1) .fill {
--i3:23px;}

.icon.A:nth-child(5) .fill {
--i3:24px;}

.icon.A:nth-child(1) .container, .icon.A:nth-child(1) .fill {
clip-path:path("M25.7364 15.3008C25.1037 14.8997 24.2963 14.8997 23.6636 15.3008L15.8991 20.2237C15.3392 20.5786 15 21.1954 15 21.8583V24.9141V31.1582V31.4C15 33.3882 16.6118 35 18.6 35H30.8C32.7882 35 34.4 33.3882 34.4 31.4V31.1582V24.9141V21.8583C34.4 21.1954 34.0607 20.5786 33.5009 20.2237L25.7364 15.3008Z");}

.icon.A:nth-child(2) .container, .icon.A:nth-child(2) .fill {
clip-path:path("M19.6 15C17.6118 15 16 16.6118 16 18.6V21.4531V25.5274V33.5977C16 34.6825 17.1805 35.3552 18.1138 34.8021L24.2862 31.144C24.7263 30.8831 25.2737 30.8831 25.7138 31.144L31.8862 34.8021C32.8195 35.3552 34 34.6825 34 33.5977V25.5274V21.4531V18.6C34 16.6118 32.3882 15 30.4 15H19.6Z");}

.icon.A:nth-child(4) .container, .icon.A:nth-child(4) .fill {
clip-path:path("M25 35C30.5228 35 35 30.5228 35 25C35 19.4772 30.5228 15 25 15C19.4772 15 15 19.4772 15 25C15 26.6665 15.4077 28.2379 16.1287 29.6197C16.2624 29.8759 16.2949 30.175 16.2021 30.4487L15.3752 32.885C15.0857 33.7378 15.8039 34.5937 16.694 34.4567L20.1097 33.9312V33.9312C20.2761 33.9055 20.4504 33.9091 20.6016 33.9833C21.9289 34.6344 23.4218 35 25 35Z");}

.icon.A:nth-child(5) .container, .icon.A:nth-child(5) .fill {
clip-path:path("M25 35C19.4772 35 15 30.5228 15 25C15 19.4772 19.4772 15 25 15C25.524 15 26.0385 15.0403 26.5408 15.118L33.0445 15.2602C34.0735 15.2827 34.7119 16.3885 34.2169 17.2908L33.1598 19.2179C34.3187 20.8503 35 22.8456 35 25C35 30.5228 30.5228 35 25 35Z");}

.icon.A .symbol {
stroke:var(--tertiary);}

.icon.A .stroke {
stroke:var(--secondary);}

.icon.A.inactive .path {
stroke-dasharray:7;
stroke-dashoffset:0;
transition:0.5s cubic-bezier(0,0,0.5,2) 0.4s;}

.icon.A.active .path {
stroke-dasharray:7;
stroke-dashoffset:7;
transition:0.3s cubic-bezier(0.5,-1,1,1);}

.icon.A .plus {
transform-origin:center;}

.icon.A.inactive .plus {
transform:scale(1);
transition:0.5s cubic-bezier(0,0,0.5,2) 0.4s;}

.icon.A.active .plus {
transform:scale(0);
transition:0.3s cubic-bezier(0.5,-0.5,1,1);}

.icon.A.inactive .dot:nth-child(1) {
animation:Dots1 0.7s forwards;}

.icon.A.active .dot:nth-child(1)  {
animation:Dots2 0.7s forwards;}

.icon.A.inactive .dot:nth-child(2)  {
animation:Dots1 0.7s forwards 0.1s;}

.icon.A.active .dot:nth-child(2)  {
animation:Dots2 0.7s forwards 0.1s;}

.icon.A.inactive .dot:nth-child(3)  {
animation:Dots1 0.7s forwards 0.2s;}

.icon.A.active .dot:nth-child(3)  {
animation:Dots2 0.7s forwards 0.2s;}

.icon.A span {
position:absolute;
bottom:-5px;
font-size:0.5rem;
color:var(--secondary);
transition:0.2s ease-out;}

.icon.A.active span {
color:var(--text);}

.submenu {
position:absolute;
bottom:95px;
width:50px;
height:50px;
z-index:-1;
list-style:none;}

.submenu .icon.B {
position:absolute;
width:50px;
height:50px;
display:flex;
transform:scale(0.5) translate(0,130px);}

.submenu .icon.B:nth-child(1) {
transition:0.8s cubic-bezier(0.5,-0.5,1,1);}

.submenu .icon.B:nth-child(2) {
transition:0.8s cubic-bezier(0.5,-0.5,1,1) 0.05s;}

.submenu .icon.B:nth-child(3) {
transition:0.8s cubic-bezier(0.5,-0.5,1,1) 0.1s;}

.submenu .icon.B:nth-child(4) {
transition:0.8s cubic-bezier(0.5,-0.5,1,1) 0.15s;}

nav.active .submenu .icon.B:nth-child(1) {
transform:scale(1) translate(-82px,15px);
transition:0.6s cubic-bezier(0,0,0.5,1.5);}

nav.active .submenu .icon.B:nth-child(2) {
transform:scale(1) translate(-30px,-15px);
transition:0.6s cubic-bezier(0,0,0.5,1.5) 0.05s;}

nav.active .submenu .icon.B:nth-child(3) {
transform:scale(1) translate(30px,-15px);
transition:0.6s cubic-bezier(0,0,0.5,1.5) 0.1s;}

nav.active .submenu .icon.B:nth-child(4) {
transform:scale(1) translate(82px,15px);
transition:0.6s cubic-bezier(0,0,0.5,1.5) 0.15s;}

.wrapper {
position:relative;
width:50px;
height:50px;
border-radius:50%;
transition:0.2s;
display:flex;
align-items:center;
justify-content:center;
background:var(--background);
box-shadow:5px 5px 10px rgba(0,0,0,0.2);}

.wrapper:active {
transform:scale(0.85);}

.wrapper svg {
transform:scale(0.9);
fill:var(--secondary);}

@keyframes Hide {
0%{transform:translate(calc(var(--i1) + var(--i2)),calc(var(--i3) + var(--i4)));}
100%{transform:translate(var(--i1),var(--i3));}}

@keyframes Path1 {
0%{stroke-dashoffset:7;}
100%{stroke-dashoffset:0;}}

@keyframes Path2 {
0%{stroke-dashoffset:0;}
100%{stroke-dashoffset:7;}}

@keyframes Dots1 {
0%{transform:translateY(0px);}
50%{transform:translateY(-3px);}
100%{transform:translateY(0px);}}

@keyframes Dots2 {
0%{transform:translateY(0px);opacity:1;}
50%{transform:translateY(-3px);opacity:1;}
100%{transform:translateY(0px); opacity:0;}}

</style>

<script>

const Nav = document.querySelector("nav");
const IconAs = document.querySelectorAll(".icon.A");
const Button = document.querySelector(".button");

IconAs[0].classList.add("active");
IconAs[0].classList.remove("inactive");

//Click on items
IconAs.forEach((IconA,index) => {

IconA.addEventListener("click",() => {

document.querySelector(".icon.A.active").classList.add("inactive");
document.querySelector(".icon.A.active").classList.remove("active");

IconAs[index].classList.add("active");
IconAs[index].classList.remove("inactive");

});

});


//Click on Submenu Btn
Button.querySelector("section").addEventListener("click",()=> {

if(Nav.classList.contains("active")){
    
 Nav.classList.remove("active");

}else{
    
 Nav.classList.add("active");

}

});

function demo() {

const icons = [IconAs[1], IconAs[2], IconAs[3], IconAs[0], Button.querySelector("section"), Button.querySelector("section")];

icons.forEach((icon, i) => {
  setTimeout(() => {icon.click();}, (i + 1) * 2000);
});

}

demo();

setInterval(() => {demo();},12000);

</script>
